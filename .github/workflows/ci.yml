name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build EfCore.FileSeeding.slnx -c Release
      - run: dotnet test EfCore.FileSeeding.slnx -c Release --no-build
      - run: dotnet format EfCore.FileSeeding.slnx --verify-no-changes
        if: github.event.pull_request.user.login != 'dependabot[bot]'
      - run: dotnet pack src/EfCore.FileSeeding -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/
